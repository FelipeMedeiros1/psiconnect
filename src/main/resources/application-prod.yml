spring:
  profiles: prod
  datasource:
    url: jdbc:postgresql://prod-db-host:5432/psiconnect
    driver-class-name: org.postgresql.Driver
    username: prod_user
    password: prod_password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
