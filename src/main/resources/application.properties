spring.application.name=semeando_vinculos_psicologia
logging.level.br.com.psiconnect=${APP_LOG_LEVEL:INFO}
logging.pattern.level=%5p [requestId=%X{requestId:-none} operationId=%X{operationId:-none}]
# Avoid SQL parameters and request payloads containing personal or clinical data.
spring.mvc.log-request-details=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
