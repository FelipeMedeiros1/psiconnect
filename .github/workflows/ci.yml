name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, tests, architecture and coverage
        run: bash ./mvnw --batch-mode --no-transfer-progress -DskipTests=false -Dmaven.test.skip=false clean verify

      - name: Require test and coverage reports
        run: |
          test -s target/jacoco.exec
          test -s target/site/jacoco/jacoco.xml
          test -s target/surefire-reports/TEST-br.com.psiconnect.consultorio.ArchitectureTest.xml

      - name: Publish quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: psiconnect-jar
          path: target/*.jar
          retention-days: 7
          if-no-files-found: error
